server:
  port: 8080
spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      server:
        webflux:
          discovery:
            locator:
              enabled: true
              lower-case-service-id: true

              predicates:
                - name: Path
                  args:
                    pattern: "'/${app.api-prefix}/' + serviceId + '/**'"

              filters:
                - name: RewritePath
                  args:
                    regexp: "'/${app.api-prefix}/' + serviceId + '/?(?<remaining>.*)'"
                    replacement: "'/${remaining}'"

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
app:
  api-prefix: api