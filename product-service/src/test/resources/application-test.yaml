spring:
  application:
    name: product-service
  main:
    banner-mode: off
  cloud:
    config:
      enabled: false
  datasource:
    url: jdbc:h2:mem:product_service_test;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
    open-in-view: false

eureka:
  client:
    enabled: false

app:
  security:
    enabled: true
    issuer: identity-service
    audiences:
      - product-service
    public-endpoints:
      - /v3/api-docs/**
      - /swagger-ui/**

logging:
  level:
    root: ERROR
