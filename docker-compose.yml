version: '3.8'
services:
  postgres:
    image: pgvector/pgvector:pg15
    container_name: postgres-db-microservice
    environment:
      TZ: Asia/Ho_Chi_Minh
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data-v2:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - microservice-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
networks:
  microservice-network:
    driver: bridge
volumes:
  postgres-data-v2:
    driver: local